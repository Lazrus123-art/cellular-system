<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hajime Kutsuwada 风格 - 纯手势生物细胞交互系统 V3</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe 手势识别 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <!-- 引入外部样式表 -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-cyan-300">

    <!-- 画布 -->
    <canvas id="neuralCanvas" class="absolute inset-0 z-0"></canvas>

    <!-- 左上角 HUD 数据面板 -->
    <div class="absolute top-6 left-6 z-20 cyber-panel p-4 rounded-xl text-xs w-72">
        <div class="flex items-center justify-between border-b border-cyan-500/30 pb-2 mb-2">
            <span class="font-bold tracking-wider text-cyan-400 title-font">CELLULAR SYSTEM 03</span>
            <span class="inline-block w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
        </div>
        <div class="space-y-1.5 mono-font text-slate-300">
            <div class="flex justify-between"><span>FPS 实时帧率:</span> <span id="fpsCounter" class="text-cyan-400">60</span></div>
            <div class="flex justify-between"><span>活跃细胞数:</span> <span id="nodeCounter" class="text-cyan-400">0</span></div>
            <div class="flex justify-between"><span>已吞噬数量:</span> <span id="eatenCounter" class="text-pink-400">0</span></div>
            <div class="flex justify-between"><span>360° 旋转角:</span> <span id="angleCounter" class="text-purple-400">0°</span></div>
            <div class="flex justify-between"><span>手势状态:</span> <span id="gestureStatus" class="text-emerald-400">寻找手势...</span></div>
        </div>
    </div>

    <!-- 主神经元悬浮数据标签 -->
    <div id="masterTag" class="absolute z-20 hidden cyber-panel px-3 py-1.5 rounded text-[11px] mono-font pointer-events-none text-cyan-300">
        <div class="text-cyan-400 font-bold">Mature Master Neuron</div>
        <div>State: <span id="tagState" class="text-pink-400">Tracking</span></div>
        <div>Scale: <span id="tagScale">1.0x</span></div>
    </div>

    <!-- 右下角：摄像头实时预览画中画 (CAM Feed) -->
    <div class="absolute bottom-6 right-6 z-20 cyber-panel p-1.5 rounded-xl w-48 h-36 flex flex-col items-center justify-center overflow-hidden">
        <div class="w-full text-[10px] mono-font text-cyan-400 mb-1 flex justify-between px-1">
            <span>CAM FEED</span>
            <span id="camStatus" class="text-emerald-400">SEARCHING</span>
        </div>
        <video id="webcamVideo" class="w-full h-full object-cover rounded-lg transform -scale-x-100" autoplay playsinline muted></video>
    </div>

    <!-- 底部控制面板 -->
    <div class="absolute bottom-6 left-6 z-20 w-[calc(100%-14rem)] max-w-4xl">
        <div class="cyber-panel rounded-xl p-3.5 flex flex-col md:flex-row items-center justify-between gap-3">
            
            <!-- 手势说明 -->
            <div class="flex flex-wrap items-center gap-2 text-xs">
                <div class="px-2.5 py-1 rounded bg-slate-900/80 border border-slate-700/60">
                    <span class="text-cyan-400 font-bold">[食指移动]</span> 引导主神经元
                </div>
                <div class="px-2.5 py-1 rounded bg-slate-900/80 border border-slate-700/60">
                    <span class="text-pink-400 font-bold">[食指竖起]</span> 生成新细胞
                </div>
                <div class="px-2.5 py-1 rounded bg-slate-900/80 border border-slate-700/60">
                    <span class="text-purple-400 font-bold">[双指捏合]</span> 360°旋转
                </div>
            </div>

            <!-- 形态切换 -->
            <div class="flex items-center gap-1.5 bg-slate-950/60 p-1 rounded-lg border border-slate-800">
                <button onclick="setLayout('dna')" id="btn-dna" class="cyber-button active px-2.5 py-1 rounded text-xs mono-font">DNA 螺旋</button>
                <button onclick="setLayout('chessboard')" id="btn-chessboard" class="cyber-button px-2.5 py-1 rounded text-xs mono-font">网格矩阵</button>
                <button onclick="setLayout('circular')" id="btn-circular" class="cyber-button px-2.5 py-1 rounded text-xs mono-font">环形阵列</button>
                <button onclick="setLayout('random')" id="btn-random" class="cyber-button px-2.5 py-1 rounded text-xs mono-font">随意散开</button>
            </div>

            <!-- 控制按钮 -->
            <div class="flex items-center gap-2">
                <button onclick="toggleSeedMaster()" id="btn-seed" class="cyber-button active px-3 py-1.5 rounded-lg text-xs mono-font font-bold">主细胞</button>
                <button onclick="resetView()" class="cyber-button px-2.5 py-1.5 rounded-lg text-xs mono-font">重置视角</button>
                <button onclick="clearScreen()" class="cyber-button px-2.5 py-1.5 rounded-lg text-xs mono-font text-pink-400 border-pink-500/40">清屏</button>
            </div>

        </div>
    </div>

    <!-- 脚本引入 -->
    <script src="script.js"></script>
</body>
</html>
