<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hajime Kutsuwada 风格 - 终极高保真生物细胞神经元宇宙 V5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google MediaPipe 双手识别库 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#02050e] text-cyan-300 overflow-hidden select-none font-sans">

    <!-- 画布与隐藏摄像头 -->
    <canvas id="neuralCanvas" class="absolute inset-0 z-0"></canvas>
    <video id="webcamVideo" class="hidden" autoplay playsinline></video>

    <!-- 左上角 HUD 监视面板 -->
    <div class="absolute top-6 left-6 z-20 cyber-panel p-4 rounded-xl backdrop-blur-md text-xs w-80">
        <div class="flex items-center justify-between border-b border-cyan-500/30 pb-2 mb-2">
            <span class="font-bold tracking-wider text-cyan-400 font-mono">NEURAL COSMOS V5.0</span>
            <span class="inline-block w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
        </div>
        <div class="space-y-1.5 font-mono text-slate-300">
            <div class="flex justify-between"><span>FPS 实时帧率:</span> <span id="fpsCounter" class="text-cyan-400">60</span></div>
            <div class="flex justify-between"><span>细胞总数 (Mass):</span> <span id="nodeCounter" class="text-cyan-400">120</span></div>
            <div class="flex justify-between"><span>左手视角状态:</span> <span id="leftHandStatus" class="text-purple-400">未检测 [Standby]</span></div>
            <div class="flex justify-between"><span>右手互动状态:</span> <span id="rightHandStatus" class="text-emerald-400">未检测 [Standby]</span></div>
        </div>
    </div>

    <!-- 细胞状态悬浮标签 -->
    <div id="masterTag" class="absolute z-25 hidden cyber-panel px-3 py-1.5 rounded text-[11px] font-mono pointer-events-none text-cyan-300">
        <div class="text-cyan-400 font-bold" id="tagName">Neuron Node</div>
        <div id="tagState">State: Active Fusion</div>
    </div>

    <!-- 底部控制面板与双手指引 -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 w-[95%] max-w-6xl">
        <div class="cyber-panel rounded-xl p-4 flex flex-col md:flex-row items-center justify-between gap-4">
            
            <!-- 双手操作指南 -->
            <div class="flex flex-wrap items-center gap-2 text-xs">
                <span class="px-2.5 py-1 rounded bg-slate-900/60 border border-slate-700 text-cyan-400">[左手: 全景旋转/缩放]</span>
                <span class="px-2.5 py-1 rounded bg-slate-900/60 border border-slate-700 text-purple-400">[右手: 拖动/撒种细胞]</span>
                <span class="px-2.5 py-1 rounded bg-slate-900/60 border border-slate-700 text-pink-400">[双手拍合: 切换阵列]</span>
            </div>

            <!-- 阵列形态切换 -->
            <div class="flex items-center gap-1.5 bg-slate-950/50 p-1.5 rounded-lg border border-slate-800">
                <button onclick="setLayout('chessboard')" id="btn-chessboard" class="cyber-button px-3 py-1.5 rounded text-xs mono-font text-cyan-300">棋盘格</button>
                <button onclick="setLayout('dna')" id="btn-dna" class="cyber-button px-3 py-1.5 rounded text-xs mono-font text-cyan-300">DNA双螺旋链</button>
                <button onclick="setLayout('circular')" id="btn-circular" class="cyber-button px-3 py-1.5 rounded text-xs mono-font text-cyan-300">环形星系</button>
                <button onclick="setLayout('random')" id="btn-random" class="cyber-button px-3 py-1.5 rounded text-xs mono-font text-cyan-300">漫游宇宙</button>
            </div>

            <!-- 右侧操作区 -->
            <div class="flex items-center gap-2">
                <button onclick="spawnMasterNeuron()" class="cyber-button px-4 py-2 rounded-lg text-xs mono-font font-bold text-cyan-300">+ 召唤主神经元</button>
                <button onclick="clearScreen()" class="cyber-button px-4 py-2 rounded-lg text-xs mono-font font-bold text-pink-400 border-pink-500/40">一键清屏</button>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
